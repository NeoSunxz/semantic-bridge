name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { rid: linux-x64, os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-24.04-arm }
          - { rid: win-x64, os: windows-latest }
          - { rid: win-arm64, os: windows-11-arm }
          - { rid: osx-arm64, os: macos-latest }
          - { rid: osx-x64, os: macos-15-intel }
    steps:
      - name: Validate tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "Tag '$GITHUB_REF_NAME' is not a valid release tag (expected vMAJOR.MINOR.PATCH[-prerelease])." >&2
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Test
        shell: bash
        run: dotnet test -c Release
      - name: Publish single file
        shell: bash
        run: dotnet publish src/SemanticBridge/SemanticBridge.csproj -c Release -r "${{ matrix.rid }}" -p:Version="$VERSION" -o out
      - name: Smoke test
        shell: bash
        run: |
          bin=out/sbridge
          if [ -f out/sbridge.exe ]; then bin=out/sbridge.exe; fi
          scripts/smoke-mcp.sh "$bin"
      - name: Add licence files
        shell: bash
        run: |
          cp LICENSE THIRD-PARTY-NOTICES.md out/
          cp -r licenses out/licenses
          ls -lR out
      - name: Archive
        shell: bash
        run: |
          name="sbridge-${VERSION}-${{ matrix.rid }}"
          mkdir -p dist
          case "${{ matrix.rid }}" in
            win-*)
              pwsh -NoProfile -Command "Compress-Archive -Path 'out/*' -DestinationPath 'dist/$name.zip'"
              ;;
            *)
              tar -C out -czf "dist/$name.tar.gz" .
              ;;
          esac
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "Tag '$GITHUB_REF_NAME' is not a valid release tag (expected vMAJOR.MINOR.PATCH[-prerelease])." >&2
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Pack dotnet tool
        run: dotnet pack src/SemanticBridge/SemanticBridge.csproj -c Release -p:Version="${GITHUB_REF_NAME#v}" -o nupkg
      - name: Checksums
        run: |
          cd dist
          sha256sum sbridge-* > SHA256SUMS
          cat SHA256SUMS
      - name: Release notes
        run: |
          cat > notes.md <<'EOF'
          Semantic Bridge for Power BI. Not affiliated with or endorsed by Microsoft.

          ## Platform status

          CI checks on a native runner for each platform that the binary starts and answers the MCP handshake. REST and XMLA against a live tenant are not exercised by CI.

          | Platform | Archive | XMLA |
          |---|---|---|
          | Linux x64 | `sbridge-VERSION-linux-x64.tar.gz` | unverified |
          | Linux arm64 | `sbridge-VERSION-linux-arm64.tar.gz` | unverified |
          | Windows x64 | `sbridge-VERSION-win-x64.zip` | unverified |
          | Windows arm64 | `sbridge-VERSION-win-arm64.zip` | unverified |
          | macOS x64 | `sbridge-VERSION-osx-x64.tar.gz` | unverified |
          | macOS arm64 | `sbridge-VERSION-osx-arm64.tar.gz` | unverified |

          "XMLA unverified" means the XMLA path has not been confirmed against a live workspace on that platform.

          Verify downloads with `SHA256SUMS`.
          EOF
          sed -i "s/VERSION/${GITHUB_REF_NAME#v}/g" notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md "${flags[@]}"
      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "NUGET_API_KEY not set; skipping NuGet push."
            exit 0
          fi
          dotnet nuget push "nupkg/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
